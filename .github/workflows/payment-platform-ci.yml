
name: Payment Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paymentdb
          POSTGRES_USER: payment_user
          POSTGRES_PASSWORD: payment_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment_user -d paymentdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_pass

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests and package application
        run: ./mvnw -B clean verify

      - name: Build Docker image
        run: docker build -t payment-platform:${{ github.sha }} .

      - name: Display build information
        run: docker images payment-platform
